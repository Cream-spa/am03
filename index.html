<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><meta name="theme-color" content="#f5f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AM03"><meta name="robots" content="noindex,nofollow"><title>AM03 리밸런싱</title>
<style>
/* 디자인 (2026-09-28 AM03 개편) — 애플 앱처럼: 회색 바탕 위 흰 카드 · 큰 숫자 하나 · 색은 숫자에만.
   계좌(연금 · ISA · 일반)는 세 열로 세워 1 보유 → 2 주문 → 3 최종이 같은 열에서 이어 읽히게 했다.
   JS 가 쓰는 클래스 · id 는 그대로다 — 바뀐 것은 표현층뿐. */
:root{
  color-scheme:light;
  --page:#F5F5F7; --card:#FFFFFF; --card2:#F7F7F9; --field:#FFFFFF;
  --fill:rgba(118,118,128,.14); --fill2:rgba(118,118,128,.07);
  --ink:#1D1D1F; --ink2:#424245; --ink3:#6E6E73; --ink4:#86868B;
  --hair:rgba(0,0,0,.07); --hair2:rgba(0,0,0,.12);
  --up:#D70015; --upf:#FF3B30; --upbg:rgba(255,59,48,.09);
  --dn:#0066CC; --dnf:#0A84FF; --dnbg:rgba(0,122,255,.09);
  --good:#248A3D; --goodf:#34C759; --goodbg:rgba(52,199,89,.13);
  --warn:#B25000; --warnf:#FF9F0A; --warnbg:rgba(255,159,10,.13);
  --accent:#0071E3; --ring:rgba(0,113,227,.28);
  /* 자산 종류 — 검증 스크립트 통과(인접 CVD ΔE ≥ 8.4). 연한 두 색은 늘 글자 라벨과 함께 쓴다 */
  --k-core:#2a78d6; --k-lev:#eb6834; --k-stock:#1baf7a; --k-def:#eda100; --k-cash:#AEAEB2;
  --grid:#EDEDF0; --axis:#D2D2D7;
  --sh1:0 1px 2px rgba(0,0,0,.04);
  --sh2:0 1px 2px rgba(0,0,0,.03),0 10px 30px rgba(0,0,0,.05);
  --sh3:0 18px 50px rgba(0,0,0,.16);
  --glass:rgba(250,250,252,.78);
  --spring:cubic-bezier(.34,1.56,.64,1); --out:cubic-bezier(.22,1,.36,1);
  --rowh:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --page:#000000; --card:#1C1C1E; --card2:#242426; --field:#2C2C2E;
  --fill:rgba(120,120,128,.30); --fill2:rgba(120,120,128,.16);
  --ink:#F5F5F7; --ink2:#D1D1D6; --ink3:#A1A1A6; --ink4:#8E8E93;
  --hair:rgba(255,255,255,.08); --hair2:rgba(255,255,255,.15);
  --up:#FF6961; --upf:#FF453A; --upbg:rgba(255,69,58,.16);
  --dn:#6CB4FF; --dnf:#0A84FF; --dnbg:rgba(10,132,255,.18);
  --good:#30D158; --goodf:#30D158; --goodbg:rgba(48,209,88,.16);
  --warn:#FFB340; --warnf:#FF9F0A; --warnbg:rgba(255,159,10,.17);
  --accent:#0A84FF; --ring:rgba(10,132,255,.45);
  --k-core:#3987e5; --k-lev:#d95926; --k-stock:#199e70; --k-def:#c98500; --k-cash:#636366;
  --grid:#2C2C2E; --axis:#3A3A3C;
  --sh1:none; --sh2:0 0 0 1px rgba(255,255,255,.06); --sh3:0 18px 50px rgba(0,0,0,.6);
  --glass:rgba(22,22,24,.72);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#000000; --card:#1C1C1E; --card2:#242426; --field:#2C2C2E;
  --fill:rgba(120,120,128,.30); --fill2:rgba(120,120,128,.16);
  --ink:#F5F5F7; --ink2:#D1D1D6; --ink3:#A1A1A6; --ink4:#8E8E93;
  --hair:rgba(255,255,255,.08); --hair2:rgba(255,255,255,.15);
  --up:#FF6961; --upf:#FF453A; --upbg:rgba(255,69,58,.16);
  --dn:#6CB4FF; --dnf:#0A84FF; --dnbg:rgba(10,132,255,.18);
  --good:#30D158; --goodf:#30D158; --goodbg:rgba(48,209,88,.16);
  --warn:#FFB340; --warnf:#FF9F0A; --warnbg:rgba(255,159,10,.17);
  --accent:#0A84FF; --ring:rgba(10,132,255,.45);
  --k-core:#3987e5; --k-lev:#d95926; --k-stock:#199e70; --k-def:#c98500; --k-cash:#636366;
  --grid:#2C2C2E; --axis:#3A3A3C;
  --sh1:none; --sh2:0 0 0 1px rgba(255,255,255,.06); --sh3:0 18px 50px rgba(0,0,0,.6);
  --glass:rgba(22,22,24,.72);
}
*{box-sizing:border-box}
html{background:var(--page);scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font-size:15px;line-height:1.5;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",system-ui,"Malgun Gothic",sans-serif}
button{font:inherit;color:inherit}
.mono{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .dn{color:var(--dn)} .flat{color:var(--ink3)}
.app{max-width:1320px;margin:0 auto;padding:0 28px 120px}
#body{transition:opacity .3s}
#body>.card{margin-bottom:20px}
:focus-visible{outline:none;box-shadow:0 0 0 4px var(--ring)!important}

/* 상단 바 — 반투명 유리 */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin:0 -28px 28px;padding:12px 28px;background:var(--glass);border-bottom:1px solid var(--hair);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto}
.brand>div{min-width:0}
.logo{width:30px;height:30px;flex:none}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.brand .meta{font-size:12px;color:var(--ink4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:10px;align-items:center;flex:none}
.ibtn{width:36px;height:36px;border-radius:50%;border:none;background:var(--fill2);color:var(--ink2);cursor:pointer;
  display:grid;place-items:center;transition:transform .4s var(--spring),background .2s}
.ibtn:hover{background:var(--fill)} .ibtn:active{transform:scale(.9)}
.ibtn svg{width:17px;height:17px}
.ibtn.busy svg{animation:sp .9s linear infinite} .ibtn:disabled{cursor:wait}
.pill{border:none;border-radius:980px;padding:8px 18px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;
  background:var(--fill2);transition:transform .4s var(--spring),filter .2s}
.pill.pri{background:var(--accent);color:#fff}
.pill:hover{filter:brightness(1.06)} .pill:active{transform:scale(.95)}

/* 카드 · 섹션 제목 */
.card{background:var(--card);border-radius:24px;box-shadow:var(--sh2);padding:28px;min-width:0}
.sec>h2{font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-.025em;line-height:1.25;display:flex;align-items:center;gap:10px}
.sec>.sub{font-size:13.5px;color:var(--ink3);margin-bottom:20px;line-height:1.6}
.sec>.sub b{color:var(--ink2);font-weight:600}
.step{width:24px;height:24px;border-radius:50%;background:var(--fill2);color:var(--ink2);flex:none;
  display:inline-grid;place-items:center;font-size:13px;font-weight:700;font-style:normal}
.plabel{display:inline-block;background:var(--fill2);color:var(--ink3);border-radius:980px;padding:2px 9px;
  font-size:11.5px;font-weight:600;margin-left:6px;vertical-align:1px}
.enter{animation:rise .6s var(--out) both}
@keyframes rise{from{transform:translateY(8px)}}

/* 히어로 — 총자산 한 숫자가 주인공, 오른쪽은 목표 구성 */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:44px;align-items:center;padding:36px 40px}
@media(max-width:960px){.hero{grid-template-columns:minmax(0,1fr);gap:28px;padding:28px 24px}}
.eyebrow{font-size:14px;font-weight:600;color:var(--ink3)}
.big{font-size:clamp(44px,5.4vw,68px);font-weight:700;letter-spacing:-.045em;line-height:1.04;margin:6px 0 22px;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.flow{display:flex;gap:36px;flex-wrap:wrap;margin-bottom:24px}
.chip{display:flex;flex-direction:column;gap:2px;font-size:13px;font-weight:600;color:var(--ink3)}
.chip b{font-size:21px;font-weight:700;letter-spacing:-.025em;color:var(--ink);font-variant-numeric:tabular-nums}
.state{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px 24px;padding-top:20px;border-top:1px solid var(--hair)}
.pillx{display:flex;flex-direction:column;gap:2px;min-width:0}
.pillx .lbl{font-size:12px;color:var(--ink3);font-weight:500}
.pillx b{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pillx.warn b{color:var(--warn)}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--axis)}
.dots i.on{background:var(--ink)}
.hlink{display:inline-flex;align-items:center;gap:4px;margin:14px 0 0 10px;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none}
.hlink:hover{text-decoration:underline}

/* 목표 구성 링 */
.ring{display:grid;grid-template-columns:176px minmax(0,1fr);gap:24px;align-items:center}
@media(max-width:520px){.ring{grid-template-columns:1fr;justify-items:center}}
.ringsvg{width:176px;height:176px;display:block;overflow:visible}
.ringsvg .trk{fill:none;stroke:var(--fill2);stroke-width:14}
.ringsvg .rs{fill:none;stroke-width:14;cursor:pointer;transition:stroke-width .4s var(--spring),opacity .25s}
.ringsvg .rs.draw{animation:draw 1.1s var(--out) both}
@keyframes draw{from{stroke-dasharray:0 999}}
.ring.focus .rs{opacity:.25} .ring.focus .rs.hot{opacity:1;stroke-width:20}
.rc1{font-size:32px;font-weight:700;letter-spacing:-.04em;fill:var(--ink)}
.rc2{font-size:11.5px;font-weight:600;fill:var(--ink3)}
.rleg{display:flex;flex-direction:column;gap:2px;min-width:0}
.rl{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 10px;border-radius:12px;
  border:none;background:none;text-align:left;cursor:pointer;transition:background .2s,opacity .25s}
.rl:hover,.rl.hot{background:var(--fill2)}
.ring.focus .rl:not(.hot){opacity:.45}
.rl i{width:10px;height:10px;border-radius:50%}
.rl span{font-size:15px;font-weight:600;min-width:0}
.rl span small{display:block;font-size:12px;color:var(--ink3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.rfoot{font-size:12.5px;color:var(--ink3);margin:6px 10px 0;padding-top:10px;border-top:1px solid var(--hair)}
.rfoot b{color:var(--ink2);font-weight:600}

/* 공식 결정 / 참고 — 세그먼트 컨트롤 */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:11px;padding:2px;margin:4px 0 20px;max-width:480px}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);background:var(--card);border-radius:9px;
  box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .45s var(--spring)}
.seg[data-on="day"] .thumb{transform:translateX(100%)}
.tab{position:relative;z-index:1;border:none;background:none;padding:7px 12px;border-radius:9px;cursor:pointer;
  font-size:13.5px;font-weight:600;color:var(--ink3);transition:color .2s;display:flex;justify-content:center;align-items:baseline;gap:8px;white-space:nowrap}
.tab.on{color:var(--ink)}
.tab small{font-size:12px;font-weight:500;color:var(--ink4);font-variant-numeric:tabular-nums}
.warnbar{background:var(--warnbg);color:var(--warn);padding:12px 16px;border-radius:14px;font-size:13.5px;margin:-6px 0 20px;line-height:1.6}
.warnbar b{font-weight:700}

/* 계좌 세 열 — 1 · 2 · 3 번 모두 같은 열 배치(연금 · ISA · 일반) */
.acols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
@media(max-width:1080px){.acols{grid-template-columns:minmax(0,1fr)}}
.acols>.colhead{display:none}
.acols>.guide,.acols>.empty,.acols>.fwarn,.acols>.chk,.acols>.abox:not([data-a]){grid-column:1/-1}
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:stretch;margin-bottom:20px}
.bento .wide{grid-column:1/-1}
@media(max-width:900px){.bento{grid-template-columns:minmax(0,1fr)}}

/* 계좌 블록 — 흰 카드 안의 옅은 회색 판 */
.colhead{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--ink4);font-weight:600;padding:0 2px 6px}
.abox{border-radius:18px;background:var(--card2);padding:2px 16px 14px;min-width:0;transition:opacity .3s}
.ahead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:14px 0 12px;border-bottom:1px solid var(--hair)}
.ahead .n{font-size:16px;font-weight:700;letter-spacing:-.02em}
.ahead .n small{display:block;font-size:12px;font-weight:500;color:var(--ink3);letter-spacing:0;margin-top:1px}
.ahead .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.ahead .v small{display:block;font-size:12px;color:var(--ink3);font-weight:500}
.ahead .v .b{color:var(--up)} .ahead .v .s{color:var(--dn);margin-left:10px}
.capf{display:flex;align-items:center;gap:8px}
.capf span{font-size:12px;color:var(--ink3);font-weight:600}
.ahead input.cap{width:128px}
.asub{font-size:12px;font-weight:500;color:var(--ink3);text-align:right;padding:6px 0 0;font-variant-numeric:tabular-nums;min-height:24px}
.asub.bad{color:var(--up);font-weight:600}
.anote{font-size:13px;color:var(--ink3);padding:14px 0 6px}
#orders .abox.off,#final .abox.off{opacity:.55}
#orders .abox.off .asub,#final .abox.off .asub{display:none}
#holds .abox.off .hrow,#holds .abox.off .hhead{opacity:.55}

/* 1 보유 입력 */
.acash{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 2px}
.acash .l{font-size:13px;color:var(--ink2);font-weight:600}
.acash input{flex:0 0 140px}
.hhead,.hrow{display:grid;grid-template-columns:minmax(0,1fr) 60px 84px 82px;gap:8px;align-items:center}
.hhead{font-size:11.5px;color:var(--ink4);font-weight:600;padding:14px 0 6px;border-bottom:1px solid var(--hair)}
.hhead span{text-align:right} .hhead span:first-child{text-align:left}
.hrow{padding:8px 0;border-bottom:1px solid var(--hair);min-height:var(--rowh)}
.hrow:last-of-type{border-bottom:none}
.hrow input.q{font-size:14px;padding:7px 8px}
.tick{min-width:0}
.tick .code{font-weight:700;font-size:15px;letter-spacing:-.015em;vertical-align:middle;font-variant-numeric:tabular-nums}
.tick .map{display:inline-block;vertical-align:middle;margin-left:6px;font-size:10.5px;font-weight:600;color:var(--ink3);
  background:var(--fill2);border-radius:6px;padding:1px 6px}
.tick .map.alt{color:var(--warn);background:var(--warnbg)}
.tick .nm{display:block;font-size:12px;font-weight:500;color:var(--ink3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick.kr .code{font-size:14.5px}
input.q{width:100%;background:var(--field);border:none;box-shadow:inset 0 0 0 1px var(--hair2);border-radius:9px;padding:8px 10px;color:var(--ink);
  font-size:14.5px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-family:inherit;
  transition:box-shadow .2s,background .2s}
input.q:hover{box-shadow:inset 0 0 0 1px var(--ink4)}
input.q:focus,input.q:focus-visible{outline:none;box-shadow:inset 0 0 0 1px var(--accent),0 0 0 4px var(--ring)!important}
input.q::placeholder{color:var(--ink4);font-weight:500}
.val{text-align:right;font-variant-numeric:tabular-nums}
.val b{display:block;font-size:14px;font-weight:600}
.pl{font-size:12px;font-weight:600}
.krtog{font-size:13px;font-weight:600;color:var(--accent);background:none;border:none;padding:12px 0 2px;cursor:pointer}
.krtog:hover{text-decoration:underline}
.empty{color:var(--ink3);font-size:14px;padding:24px 0;text-align:center}

/* 입력 그룹 — iOS 설정 화면처럼 (환율 · 총자산 / 추가 납입금) */
.setrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px;align-items:start}
@media(max-width:1080px){.setrow{grid-template-columns:minmax(0,1fr)}}
.group{border-radius:18px;background:var(--card2);padding:2px 16px}
.group .gl{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;border-bottom:1px solid var(--hair)}
.group .gl:last-child{border-bottom:none}
.group .gl>span{font-size:14px;font-weight:600;color:var(--ink2)}
.group .gl>span small{display:block;font-size:12px;color:var(--ink3);font-weight:500}
.group .gl input.q,.group .gl .q.ro{width:160px;flex:none}
.q.ro{display:flex;align-items:center;justify-content:flex-end;padding:8px 10px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.addbox{padding-bottom:12px}
.addbox .gl{border-bottom:none}
.addbox .gl input.q{font-size:18px;font-weight:700;padding:10px 12px;width:180px}
.qchips{display:flex;gap:8px;flex-wrap:wrap;padding:0 0 12px}
.qchip{border:none;border-radius:980px;background:var(--card);box-shadow:inset 0 0 0 1px var(--hair2);padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;
  transition:transform .4s var(--spring),background .2s}
.qchip:hover{background:var(--fill2)} .qchip:active{transform:scale(.92)}
.qchip.ghost{background:none;box-shadow:none;color:var(--ink3)}
.qchip.pop{animation:pop .5s var(--spring)}
@keyframes pop{0%{transform:scale(.88)}55%{transform:scale(1.1)}100%{transform:scale(1)}}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;border-top:1px solid var(--hair);cursor:pointer;position:relative}
.sw .swl{font-size:14px;font-weight:600;color:var(--ink2)}
.swi{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.track{position:relative;width:51px;height:31px;border-radius:31px;background:var(--fill);flex:none;transition:background .3s}
.track::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .5s var(--spring)}
.sw:active .track::after{width:31px}
.swi:checked+.track{background:var(--goodf)}
.swi:checked+.track::after{transform:translateX(20px)}
.sw:active .swi:checked+.track::after{transform:translateX(16px)}
.swi:focus-visible+.track{box-shadow:0 0 0 4px var(--ring)}
.addnote{font-size:13px;color:var(--ink3);line-height:1.6;word-break:keep-all;padding-top:8px}
.addnote:empty{display:none}
.addnote b{color:var(--ink);font-weight:700}

/* 2 주문 — 흰 칸 하나가 주문 하나, 누르면 체크 */
.prog{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink3);font-weight:600;margin:-6px 0 16px;max-width:520px}
.prog .pt{flex:1;height:6px;border-radius:6px;background:var(--fill2);overflow:hidden}
.prog .pt i{display:block;height:100%;width:0;border-radius:6px;background:var(--goodf);transition:width .7s var(--out)}
.prog b{color:var(--ink);font-variant-numeric:tabular-nums}
.prog.all span:first-child,.prog.all b{color:var(--good)}

  transition:transform .4s var(--spring),opacity .3s,box-shadow .2s}
.ord:hover{box-shadow:0 4px 14px rgba(0,0,0,.06),inset 0 0 0 1px var(--hair2)} .ord:active{transform:scale(.98)}
.ord .tag{font-size:12px;font-weight:700;padding:4px 9px;border-radius:7px;white-space:nowrap}
.ord .tag.buy{color:var(--up);background:var(--upbg)} .ord .tag.sell{color:var(--dn);background:var(--dnbg)}
.who{min-width:0}

.okm{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--hair2);display:grid;place-items:center;
  transition:background .3s,box-shadow .3s,transform .5s var(--spring)}
.okm svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;

.ord.done{opacity:.55}

.cf{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:70;animation:cf 1s var(--out) forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}

/* 3 최종 계좌 */
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto 96px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair);
  font-size:14px;min-height:var(--rowh)}

.fnone{color:var(--ink3);font-size:13px;padding:14px 0}

/* 왜 이 비율인가 — 한 줄 요약 → A · B 묶음을 따로(판단 3단계 + 자리별 줄) → 두 묶음 평균 */
#why{scroll-margin-top:84px}
#why:empty{display:none}

.wlead{margin:0 0 18px;font-size:15.5px;line-height:1.65;color:var(--ink2)}
.wlead b{color:var(--ink);font-weight:700}
.wab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:1080px){.wab{grid-template-columns:1fr}}
.wb{background:var(--card2);border-radius:18px;padding:18px 18px 6px;min-width:0;container-type:inline-size}

.wbh b{display:block;font-size:15px;font-weight:700}
.wbh small{display:block;margin-top:1px;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.wsteps{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:6px}
.wsteps li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.55;color:var(--ink2);font-variant-numeric:tabular-nums}

.wrows{border-top:1px solid var(--hair2)}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) 108px 88px 84px;grid-template-areas:"n t s w";align-items:center;column-gap:12px;padding:10px 0;border-bottom:1px solid var(--hair)}
.wrow:last-child{border-bottom:0}

.wrow .wn b{font-size:14px;font-weight:600}
.wrow .wn small{margin-left:6px;font-size:11.5px;color:var(--ink3)}
.wrow .wtr{grid-area:t;display:flex;align-items:center;gap:6px}
.wgap{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.wrow .wsg{grid-area:s;display:flex;align-items:center;gap:6px}
.wdots{display:inline-flex;gap:3px}
.wdots i{width:7px;height:7px;border-radius:50%;background:var(--fill)}
.wdots i.f{background:var(--k-core)}
.wpc{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.wna{color:var(--ink4)}
.wrow .ww{grid-area:w;text-align:right;font-variant-numeric:tabular-nums}
.wrow .ww b{font-size:14.5px;font-weight:700}
.wbar{display:block;height:4px;margin-top:5px;border-radius:2px;background:var(--fill2);overflow:hidden}

@container (max-width:430px){
  .wrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n w" "t s";row-gap:6px}
  .wrow .wsg{justify-self:end}
}
.wtot{margin-top:14px;padding:16px 18px 6px;border:1px solid var(--hair2);border-radius:18px;container-type:inline-size}

.wthc{display:grid;grid-template-columns:minmax(0,1fr) auto 84px 60px;column-gap:12px;font-size:11.5px;font-weight:600;color:var(--ink4);padding:0 0 6px;border-bottom:1px solid var(--hair2)}
.wthc span{text-align:right} .wthc span:first-child{text-align:left}
.otodo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--card2);border-radius:14px;padding:11px 16px;margin:0 0 16px;font-size:13.5px;color:var(--ink2)}

.otodo .oarr{color:var(--ink4)}
.otodo .onote{color:var(--ink3);font-size:12.5px}

@container (max-width:430px){.wtot .wrow{grid-template-columns:minmax(0,1fr) 84px;grid-template-areas:"n w" "a d";row-gap:2px}.wthc{display:none}}
.wy{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 8px}

/* 지표 타일 · 차트 공통 — 선 2px · 격자는 헤어라인 · 숫자는 먹색 */
.ycard,.kpi,.dcard{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.ycard{grid-template-columns:repeat(auto-fit,minmax(112px,1fr))}
.ycard>div,.kpi>div,.dcard>div{background:var(--card2);border-radius:16px;padding:14px 16px}

.ycard .d,.kpi .d,.dcard .d{font-size:12px;color:var(--ink3);font-weight:500;margin-top:2px}
.chart,.cchart,.dchart{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
svg .gl{stroke:var(--grid);stroke-width:1}

.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.s{stroke:var(--ink)} .chart .ln.q{stroke:var(--ink4);stroke-width:1.5}
.chart .xh{stroke:var(--ink3);stroke-width:1;opacity:0}

.chart .hpt.on{r:6}
.chart:focus-visible{border-radius:8px}
.leg{display:flex;gap:18px;font-size:13px;font-weight:600;color:var(--ink2);margin:10px 0 0}
.leg i{display:inline-block;width:16px;height:2px;border-radius:2px;vertical-align:middle;margin-right:7px}
.leg .s i{background:var(--ink)} .leg .q i{background:var(--ink4)}
.mbars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-top:18px;padding-top:16px;border-top:1px solid var(--hair)}
.mb{text-align:center;min-width:0}
.mb .pos,.mb .neg{height:32px;display:flex;justify-content:center}
.mb .pos{align-items:flex-end} .mb .neg{align-items:flex-start}
.mb i{display:block;width:min(46%,12px);min-height:1px}

.mb .k{font-size:10.5px;color:var(--ink4);font-weight:500}

/* 이번 달 성과 · 분포 막대 */
.rbar{position:relative;height:6px;background:var(--fill2);border-radius:6px;margin:18px 0 8px}
.rbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--axis)}

/* 저장본 */

.snap th{color:var(--ink3);font-weight:500;font-size:12px;text-align:right;padding:8px 10px;border-bottom:1px solid var(--hair2)}
.snap th:first-child{text-align:left;padding-left:0}
.snap td{padding:11px 10px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--hair)}
.snap td:first-child{text-align:left;font-weight:700;padding-left:0}
.snap td small{display:block;font-size:12px;font-weight:500;color:var(--ink3);margin-top:2px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.snap .sfoot{margin-top:12px;padding-top:12px;border-top:1px solid var(--hair);font-size:13.5px;color:var(--ink2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* 월봉 (AMP-D 전용 — AM03 에선 숨는다) */
.ytabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ytab{border:none;background:var(--fill2);color:var(--ink2);border-radius:980px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.ytab.on{background:var(--ink);color:var(--card)}
.cn{cursor:pointer;outline:none}
.cn .hit{fill:transparent;transition:fill .2s}
.cn:hover .hit,.cn:focus-visible .hit{fill:var(--fill2)}
.cn.on .hit{fill:var(--fill)}
.cn .wk{stroke-width:1.5}
.cn.u .wk{stroke:var(--upf)} .cn.u .bd{fill:var(--upf)}
.cn.d .wk{stroke:var(--dnf)} .cn.d .bd{fill:var(--dnf)}
.cn.on .ax{fill:var(--ink);font-weight:700}
.mdet{margin-top:18px;border-top:1px solid var(--hair);padding-top:16px}
.mdet .hd{font-size:16px;font-weight:700;letter-spacing:-.02em;margin-bottom:12px}
.mdet .hd em{font-style:normal;font-size:12px;color:var(--ink3);font-weight:500;margin-left:7px}
.dchart{margin-top:14px}
.dchart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dchart .dtag{font-size:10.5px;font-weight:700;fill:var(--ink2)}
.dchart .pt{stroke:var(--card);stroke-width:2}
.dchart.u .ln{stroke:var(--upf)} .dchart.u .ar{fill:var(--upf);opacity:.1}
.dchart.d .ln{stroke:var(--dnf)} .dchart.d .ar{fill:var(--dnf);opacity:.1}
.mhold{margin-top:16px}
.mhold .t{font-size:12.5px;color:var(--ink2);font-weight:600;margin-bottom:8px}
.mhold .t b{color:var(--ink)}
.hbar{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden}
.hbar i{display:block;height:100%}
.hlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hlist span{display:inline-flex;align-items:center;gap:6px;background:var(--fill2);border-radius:980px;padding:5px 10px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.hlist i{width:8px;height:8px;border-radius:2px;display:block}
.hlist em{font-style:normal;font-size:11px;color:var(--ink3);font-weight:500}
.hlist b{color:var(--ink2);font-weight:700}
.k-core{background:var(--k-core)} .k-lev{background:var(--k-lev)} .k-stock{background:var(--k-stock)}
.k-def{background:var(--k-def)} .k-cash{background:var(--k-cash)}

/* 연도별 · 지금 상태 */
.rngc{border-radius:18px;padding:16px 18px;margin-bottom:20px;background:var(--card2)}
.rngc .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.stat::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.stat.good{background:var(--goodbg);color:var(--good)} .stat.warn{background:var(--warnbg);color:var(--warn)} .stat.bad{background:var(--upbg);color:var(--up)}
.rngc .msg{color:var(--ink3);font-size:13px}
.rngc .dcard{margin:12px 0 0}
.rngc .dcard>div{background:var(--card)}
.rngc .foot2{color:var(--ink3);font-size:12px;margin-top:12px;line-height:1.7}
.rngc .foot2 b{color:var(--ink2)}
.ywrap{overflow-x:auto}
.ytbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}

    if(lx+w>innerWidth-8)lx=x-w-16; if(lx<8)lx=8; if(ly<8)ly=y+18;
    e.style.transform=`translate(${Math.round(lx)}px,${Math.round(ly)}px)`;
  },
  hide(){if(this.el)this.el.classList.remove('on');}
};

/* 주문 체크 — 리밸런싱 날 하나씩 지워 나간다. 신호일·금액이 바뀌면 자동으로 풀린다 */
const DONEK='ampd_done';
function doneMap(){try{return JSON.parse(localStorage.getItem(DONEK)||'{}')}catch(e){return {}}}
function doneSave(m){try{localStorage.setItem(DONEK,JSON.stringify(m))}catch(e){}}
function updateProg(celebrate){
  const el=$('oprog'); if(!el)return;
  const n=$('orders').querySelectorAll('.ord').length, k=$('orders').querySelectorAll('.ord.done').length;
  if(!n){el.innerHTML='';return;}
  if(!el.firstChild)el.innerHTML='<div class="prog"><span></span><span class="pt"><i></i></span><b></b></div>';
  const p=el.firstChild;
  p.classList.toggle('all',k===n);
  p.children[0].textContent=k===n?'이번 매매 끝':'매매 체크';
  p.children[1].firstChild.style.width=(k/n*100).toFixed(1)+'%';
  p.children[2].textContent=k+'/'+n;
  if(celebrate&&k===n)burst(p);
}
function burst(anchor){
  if(REDUCE||!anchor)return;
  const r=anchor.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  const cols=['var(--k-core)','var(--k-lev)','var(--k-stock)','var(--k-def)','var(--goodf)'];
  for(let i=0;i<20;i++){
    const s=document.createElement('i'); s.className='cf';
    const a=Math.random()*Math.PI*2, d=50+Math.random()*100;
    s.style.left=cx+'px'; s.style.top=cy+'px'; s.style.background=cols[i%cols.length];
    s.style.setProperty('--dx',Math.cos(a)*d+'px'); s.style.setProperty('--dy',(Math.sin(a)*d-50)+'px');
    s.style.setProperty('--rot',(Math.random()*540-270)+'deg');
    document.body.appendChild(s); setTimeout(()=>s.remove(),1050);
  }
}

/* 목표 구성 링 — 종류별 합. 조각 사이 2.5px 틈이 구분선이다(테두리 없음).

function renderRing(){
  const el=$('ring'); if(!el)return;
  const B=D[base], tot=B.w.reduce((a,x)=>a+x.w,0);
  if(!tot){el.innerHTML='';return;}
  const g={}, names={};
  B.w.forEach(x=>{g[x.k]=(g[x.k]||0)+x.w; (names[x.k]=names[x.k]||[]).push(x.t);});
  const ks=KORDER.filter(k=>g[k]>0);
  const R=62, C=2*Math.PI*R, GAP=ks.length>1?2.5:0, pc=v=>(v/tot*100).toFixed(1)+'%';
  const risk=['core','lev','stock'].reduce((s,k)=>s+(g[k]||0),0)/tot;
  const expo=B.w.reduce((s,x)=>s+(x.k==='lev'?2:x.k==='def'||x.k==='cash'?0:1)*x.w,0)/tot;
  let off=0;
  const segs=ks.map(k=>{
    const f=g[k]/tot, len=Math.max(f*C-GAP,0.6);
    const s=`<circle class="rs${REDUCE?'':' draw'}" data-k="${k}" cx="84" cy="84" r="${R}" stroke="var(--k-${k})"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 84 84)"><title>${KIND[k]} ${pc(g[k])}</title></circle>`;
    off+=f*C; return s;
  }).join('');
  el.innerHTML=`<div class="ring">
    <svg class="ringsvg" viewBox="0 0 168 168" role="img" aria-label="목표 구성">
      <circle class="trk" cx="84" cy="84" r="${R}"/>${segs}
      <text class="rc1" x="84" y="88" text-anchor="middle">${(risk*100).toFixed(0)}%</text>
      <text class="rc2" x="84" y="106" text-anchor="middle">위험자산</text></svg>
    <div class="rleg">${ks.map(k=>`<button class="rl" data-k="${k}"><i class="k-${k}"></i>
      <span>${KIND[k]}<small>${names[k].join(' · ')}</small></span><b>${pc(g[k])}</b></button>`).join('')}
      <div class="rfoot">실효 노출 <b>${expo.toFixed(2)}배</b> · 레버 2배로 셈</div></div></div>`;
  const root=el.firstChild, t1=root.querySelector('.rc1'), t2=root.querySelector('.rc2');
  const hot=k=>{
    root.classList.toggle('focus',!!k);
    root.querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('hot',x.dataset.k===k));
    t1.textContent=k?pc(g[k]):(risk*100).toFixed(0)+'%'; t2.textContent=k?KIND[k]:'위험자산';
  };
  root.querySelectorAll('[data-k]').forEach(x=>{
    x.addEventListener('pointerenter',()=>hot(x.dataset.k));
    x.addEventListener('focus',()=>hot(x.dataset.k));
  });
  root.addEventListener('pointerleave',()=>hot(null));
  root.addEventListener('focusout',e=>{if(!root.contains(e.relatedTarget))hot(null);});
}

  $('yrsub').innerHTML=`${T.frm} → ${T.to} · 리밸 날(월말 · 월말 10거래일 전) 종가 결정을 그 종가에 체결한 기준
    <span class="plabel">매매비용 0.1% 반영</span>`;

  const W=800,H=250,L=44,R=52,TP=10,BT=26;
  const lo0=Math.min(...T.s,...T.q), hi0=Math.max(...T.s,...T.q);
  const pad=(hi0-lo0)*0.08||1, lo=lo0-pad, hi=hi0+pad;
  const n=T.s.length;
  const X=i=>L+(W-L-R)*i/(n-1);
  const Y=v=>TP+(H-TP-BT)*(1-(v-lo)/(hi-lo));
  const path=a=>a.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');

  let gl='';
  for(let k=0;k<=3;k++){
    const v=lo+(hi-lo)*k/3, y=Y(v).toFixed(1);
    gl+=`<line class="gl" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/>
      <text class="ay" x="${L-7}" y="${(+y+3.5).toFixed(1)}">${sg(v-100,0)}%</text>`;
  }
  if(lo<100&&hi>100) gl+=`<line class="base" x1="${L}" y1="${Y(100).toFixed(1)}" x2="${W-R}" y2="${Y(100).toFixed(1)}"/>`;

  let ax='';
  for(let i=1;i<n;i++){
    if(T.d[i].slice(5,7)===T.d[i-1].slice(5,7))continue;
    ax+=`<text class="ax" x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${+T.d[i].slice(5,7)}월</text>`;
  }
  // 끝 라벨 — 두 선이 너무 가까우면 전략 쪽만 단다(겹쳐 쌓지 않는다)
  const ys=Y(T.s[n-1]), yq=Y(T.q[n-1]);
  let elab=`<text class="elab" x="${W-R+6}" y="${(ys+4).toFixed(1)}">${sg(T.s[n-1]-100,0)}%</text>`;
  if(Math.abs(ys-yq)>=13) elab+=`<text class="elab" x="${W-R+6}" y="${(yq+4).toFixed(1)}" style="fill:var(--ink3)">${sg(T.q[n-1]-100,0)}%</text>`;

  const mx=Math.max(...T.m.map(o=>Math.abs(o.r)))||0.01;
  const bars=T.m.map(o=>{
    const h=Math.round(Math.abs(o.r)/mx*30), up=o.r>=0;
    return `<div class="mb">
      <div class="pos">${up?`<i style="height:${h}px"></i>`:''}</div>
      <div class="zl"></div>
      <div class="neg">${up?'':`<i style="height:${h}px"></i>`}</div>
      <div class="v ${up?'up':'dn'}">${sg(o.r*100,0)}</div>
      <div class="k">${+o.m.slice(5)}월</div></div>`;
  }).join('');

  const ex=T.tot-T.qtot;
  $('yr').innerHTML=`
    <div class="ycard">
      <div><div class="l">전략 1년 수익</div><div class="n ${T.tot>=0?'up':'dn'}">${sg(T.tot*100,1)}%</div>
        <div class="d">100 → ${T.s[n-1].toFixed(1)}</div></div>
      <div><div class="l">QQQ 같은 기간</div><div class="n ${T.qtot>=0?'up':'dn'}">${sg(T.qtot*100,1)}%</div>
        <div class="d">초과 ${sg(ex*100,1)}%p</div></div>
      <div><div class="l">최대낙폭</div><div class="n">${(T.mdd*100).toFixed(1)}%</div>
        <div class="d">QQQ ${(T.qmdd*100).toFixed(1)}%</div></div>
      <div><div class="l">상승한 달</div><div class="n">${T.win}/${T.n}</div>
        <div class="d">${(T.win/T.n*100).toFixed(0)}%</div></div>
    </div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" tabindex="0"
      aria-label="최근 1년 전략과 QQQ 수익 곡선 — 좌우 화살표로 날짜 이동">${gl}${ax}
      <path class="ln q" d="${path(T.q)}"/><path class="ln s" d="${path(T.s)}"/>${elab}
      <line class="xh" x1="0" y1="${TP}" x2="0" y2="${H-BT}"/>
      <circle class="xd q" r="4" fill="var(--ink4)"/><circle class="xd s" r="4" fill="var(--ink)"/></svg>
    <div class="leg"><span class="s"><i></i>전략</span><span class="q"><i></i>QQQ</span></div>
    <div class="mbars">${bars}</div>`;

  const svg=$('yr').querySelector('svg.chart'), xh=svg.querySelector('.xh'),
        cs=svg.querySelector('.xd.s'), cq=svg.querySelector('.xd.q');
  const rows=i=>[[T.d[i],'',null],['전략',sg(T.s[i]-100,1)+'%','var(--ink)'],['QQQ',sg(T.q[i]-100,1)+'%','var(--ink4)']];
  const pick=i=>{
    const x=X(i).toFixed(1);
    xh.setAttribute('x1',x); xh.setAttribute('x2',x);
    cs.setAttribute('cx',x); cs.setAttribute('cy',Y(T.s[i]).toFixed(1));
    cq.setAttribute('cx',x); cq.setAttribute('cy',Y(T.q[i]).toFixed(1));
    [xh,cs,cq].forEach(e=>e.style.opacity=1);
  };
  const clear=()=>{[xh,cs,cq].forEach(e=>e.style.opacity=0); TIP.hide();};
  let ki=n-1;
  svg.addEventListener('pointermove',ev=>{
    const r=svg.getBoundingClientRect(), px=(ev.clientX-r.left)/r.width*W;
    ki=Math.max(0,Math.min(n-1,Math.round((px-L)/(W-L-R)*(n-1))));
    pick(ki); TIP.show(ev.clientX,ev.clientY,rows(ki));
  });
  svg.addEventListener('pointerleave',clear);
  svg.addEventListener('blur',clear);
  svg.addEventListener('keydown',ev=>{
    if(ev.key!=='ArrowLeft'&&ev.key!=='ArrowRight')return;
    ev.preventDefault();
    ki=Math.max(0,Math.min(n-1,ki+(ev.key==='ArrowRight'?1:-1)));
    const r=svg.getBoundingClientRect();
    pick(ki); TIP.show(r.left+X(ki)/W*r.width, r.top+Y(T.s[ki])/H*r.height, rows(ki));
  });
}

/* 내 자산 기록 — 저장할 때마다 쌓인 그날 총액(이 기기 브라우저에만 저장). 입금이 있으면 그만큼 뛰어 보인다 */
function histLoad(){try{const H=JSON.parse(localStorage.getItem(LSK+'assetlog')||'[]');return Array.isArray(H)?H:[];}catch(e){return [];}}
function histSave(H){try{localStorage.setItem(LSK+'assetlog',JSON.stringify(H));}catch(e){}}
function renderHist(){
  const box=$('histbox'); if(!box)return;
  const H=histLoad();
  const head=`<section class="card sec"><h2>내 자산 기록</h2><div class="sub">「저장」을 누를 때마다 그날 총액(보유 평가액 + 예수금)이 한 점씩 쌓입니다 · 이 기기에만 저장 · 입금한 날은 그만큼 뛰어 보입니다</div>`;
  if(!H.length){ box.innerHTML=head+'<div class="empty">아직 기록이 없습니다 — 보유를 입력하고 오른쪽 위 「저장」을 누르세요</div></section>'; return; }
  const ok=v=>v>=1e8?(v/1e8).toFixed(2)+'억':Math.round(v/1e4).toLocaleString('ko-KR')+'만';
  const n=H.length, last=H[n-1], first=H[0], pk=Math.max(...H.map(h=>h.v));
  const dv=(a,b)=>`${a>=b?'+':'−'}${won(Math.abs(a-b))}원 · ${sg((a/b-1)*100,1)}%`;
  const prev=n>1?H[n-2]:null;
  const cards=`<div class="ycard">
      <div><div class="l">최근 기록 · ${last.d.slice(5)}</div><div class="n">${ok(last.v)}</div><div class="d">${won(last.v)}원</div></div>
      <div><div class="l">직전 기록 대비</div><div class="n ${prev&&last.v<prev.v?'dn':'up'}">${prev?sg((last.v/prev.v-1)*100,1)+'%':'—'}</div>
        <div class="d">${prev?`${prev.d.slice(5)} 대비 ${last.v>=prev.v?'+':'−'}${won(Math.abs(last.v-prev.v))}원`:'두 번째 기록부터'}</div></div>
      <div><div class="l">첫 기록(${first.d.slice(5)}) 대비</div><div class="n ${last.v<first.v?'dn':'up'}">${n>1?sg((last.v/first.v-1)*100,1)+'%':'—'}</div>
        <div class="d">${n>1?dv(last.v,first.v).split(' · ')[0]:'—'}</div></div>
      <div><div class="l">기록 중 최고 대비</div><div class="n">${pk>last.v?'−'+((1-last.v/pk)*100).toFixed(1)+'%':'최고'}</div>
        <div class="d">최고 ${ok(pk)}</div></div></div>`;
  let chart='';
  if(n>1){
    const W=800,H2=220,L=58,R=20,TP=12,BT=26;
    const t=h=>new Date(h.d+'T00:00:00').getTime(), t0=t(first), t1=Math.max(t(last),t0+864e5);
    const lo0=Math.min(...H.map(h=>h.v)), hi0=pk, pad=(hi0-lo0)*0.12||hi0*0.02, lo=lo0-pad, hi=hi0+pad;
    const X=h=>L+(W-L-R)*(t(h)-t0)/(t1-t0), Y=v=>TP+(H2-TP-BT)*(1-(v-lo)/(hi-lo));
    let gl='';
    for(let k=0;k<=3;k++){ const v=lo+(hi-lo)*k/3, y=Y(v).toFixed(1);
      gl+=`<line class="gl" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text class="ay" x="${L-7}" y="${(+y+3.5).toFixed(1)}">${ok(v)}</text>`; }
    const ax=[first,last].map((h,i)=>`<text class="ax" x="${X(h).toFixed(1)}" y="${H2-8}" text-anchor="${i?'end':'start'}">${h.d.slice(2).replace(/-/g,'.')}</text>`).join('');
    const d=H.map((h,i)=>(i?'L':'M')+X(h).toFixed(1)+' '+Y(h.v).toFixed(1)).join(' ');
    const dots=H.map(h=>`<circle class="hpt" cx="${X(h).toFixed(1)}" cy="${Y(h.v).toFixed(1)}" r="4"/>`).join('');
    chart=`<svg class="chart hchart" viewBox="0 0 ${W} ${H2}" role="img" tabindex="0" aria-label="저장한 날마다의 총액 — 첫 기록 ${ok(first.v)}, 최근 ${ok(last.v)}">${gl}${ax}
      <path class="ln s" d="${d}"/>${dots}<line class="xh" x1="0" y1="${TP}" x2="0" y2="${H2-BT}"/></svg>`;
  }
  box.innerHTML=head+cards+chart+`<button class="krtog" id="histundo">마지막 기록 지우기</button></section>`;
  $('histundo').addEventListener('click',()=>{ const A=histLoad(); const g=A.pop(); histSave(A); renderHist(); if(g)toast(g.d.slice(5)+' 기록을 지웠습니다'); });
  const svg=box.querySelector('svg.hchart'); if(!svg)return;
  const W=800, xh=svg.querySelector('.xh'), pts=[...svg.querySelectorAll('.hpt')];
  const rows=i=>[[H[i].d+' 저장 · 시세 '+String(H[i].px||'').slice(5),'',null],['총액',won(H[i].v)+'원','var(--ink)']]
    .concat(i?[['직전 대비',dv(H[i].v,H[i-1].v),null]]:[]);
  let ki=n-1;
  const pick=i=>{ const x=pts[i].getAttribute('cx'); xh.setAttribute('x1',x); xh.setAttribute('x2',x); xh.style.opacity=1;
    pts.forEach((p,j)=>p.classList.toggle('on',j===i)); };
  const clear=()=>{ xh.style.opacity=0; pts.forEach(p=>p.classList.remove('on')); TIP.hide(); };
  svg.addEventListener('pointermove',ev=>{
    const r=svg.getBoundingClientRect(), px=(ev.clientX-r.left)/r.width*W;
    ki=pts.reduce((b,p,j)=>Math.abs(+p.getAttribute('cx')-px)<Math.abs(+pts[b].getAttribute('cx')-px)?j:b,0);
    pick(ki); TIP.show(ev.clientX,ev.clientY,rows(ki));
  });
  svg.addEventListener('pointerleave',clear); svg.addEventListener('blur',clear);
  svg.addEventListener('keydown',ev=>{
    if(ev.key!=='ArrowLeft'&&ev.key!=='ArrowRight')return; ev.preventDefault();
    ki=Math.max(0,Math.min(n-1,ki+(ev.key==='ArrowRight'?1:-1)));
    const r=svg.getBoundingClientRect(), b=pts[ki].getBoundingClientRect();
    pick(ki); TIP.show(b.left+b.width/2,b.top,rows(ki));
  });
}

/* 월봉 — 월중 일별 평가액에서 시/고/저/종을 뽑은 봉. 위꼬리가 곧 그 달의 되돌림이다.
   연 탭으로 해를 고르고 봉을 누르면 그 달을 「월초 1억」 기준으로 펼친다. */
let CY=null, CM=null;

function renderCandles(){
  const C=D.candles;
  if(!$('cd'))return;
  if(MODE==='am03'){ const sec=$('cd').closest('section'); if(sec) sec.style.display='none'; return; }
  TIP.hide();
  if(!C||!C.length){$('cdsub').textContent='데이터 없음';$('cd').innerHTML='';return;}
  const ys=[...new Set(C.map(c=>c.m.slice(0,4)))];
  if(!ys.includes(CY)) CY=ys[ys.length-1];
  const MS=C.filter(c=>c.m.slice(0,4)===CY);
  if(!MS.some(c=>c.m===CM)) CM=MS[MS.length-1].m;

  const hs=C.filter(c=>c.src==='h');
  $('cdsub').innerHTML=`${C[0].m} ~ ${C[C.length-1].m} · 월중 일별 평가액으로 만든 봉이라
    <b>위꼬리가 곧 되돌림</b>입니다 · 봉을 누르면 그 달이 펼쳐집니다
    <span class="plabel">매매비용 0.1% 반영</span>`+(hs.length?
    `<div style="margin-top:5px">~${hs[hs.length-1].m} 는 정본 백테스트(시점별 유니버스 157종,
      생존편향 제거) · 이후는 계산기 라이브 엔진. 겹치는 47개월 실측 차이는
      수익 0.18%p·되돌림 0.04%p 입니다.</div>`:'');

  const ONE=1e8, bs=MS[0].o;
  const eok=v=>(v/1e8).toFixed(2)+'억';
  const W=800,H=270,L=62,RG=10,TP=14,BT=30;
  const lo0=Math.min(...MS.map(c=>c.l)), hi0=Math.max(...MS.map(c=>c.h));
  const pd=(hi0-lo0)*0.10||1, lo=lo0-pd, hi=hi0+pd;
  const sl=(W-L-RG)/MS.length, bw=Math.min(sl*0.46,24);
  const X=i=>L+sl*(i+0.5);
  const Y=v=>TP+(H-TP-BT)*(1-(v-lo)/(hi-lo));

  let gl='';
  for(let k=0;k<=3;k++){
    const v=lo+(hi-lo)*k/3, y=Y(v).toFixed(1);
    gl+=`<line class="gl" x1="${L}" y1="${y}" x2="${W-RG}" y2="${y}"/>
      <text class="ay" x="${L-7}" y="${(+y+3.5).toFixed(1)}">${eok(ONE*v/bs)}</text>`;
  }
  if(lo<bs&&hi>bs) gl+=`<line class="base" x1="${L}" y1="${Y(bs).toFixed(1)}" x2="${W-RG}" y2="${Y(bs).toFixed(1)}"/>`;

  const cs=MS.map((c,i)=>{
    const up=c.c>=c.o, x=X(i);
    const y1=Y(Math.max(c.o,c.c)), y2=Y(Math.min(c.o,c.c));
    return `<g class="cn ${up?'u':'d'}${c.m===CM?' on':''}" data-m="${c.m}" role="button" tabindex="0"
        aria-label="${c.m} ${sg(c.r*100,1)}%">
      <rect class="hit" x="${(x-sl/2).toFixed(1)}" y="${TP}" width="${sl.toFixed(1)}" height="${H-TP-BT}" rx="8"/>
      <line class="wk" x1="${x.toFixed(1)}" y1="${Y(c.h).toFixed(1)}" x2="${x.toFixed(1)}" y2="${Y(c.l).toFixed(1)}"/>
      <rect class="bd" x="${(x-bw/2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(y2-y1,2).toFixed(1)}" rx="3"/>
      <text class="ax" x="${x.toFixed(1)}" y="${H-10}" text-anchor="middle">${+c.m.slice(5)}월</text></g>`;
  }).join('');

  $('cd').innerHTML=
    `<div class="ytabs">${ys.map(y=>`<button class="ytab${y===CY?' on':''}" data-y="${y}">${y}</button>`).join('')}</div>
    <svg class="cchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${CY}년 월별 평가액 봉차트">${gl}${cs}</svg>`
    + monthDetail(MS.find(c=>c.m===CM));

  $('cd').querySelectorAll('.ytab').forEach(b=>b.onclick=()=>{CY=b.dataset.y;CM=null;renderCandles();});
  $('cd').querySelectorAll('.cn').forEach(g=>{
    const c=MS.find(x=>x.m===g.dataset.m);
    const rows=()=>[[c.m,'',null],['수익',sg(c.r*100,1)+'%',c.c>=c.o?'var(--upf)':'var(--dnf)'],
      ['월중 최고',sg((c.rh-1)*100,1)+'%',null],['되돌림',(c.dd*100).toFixed(1)+'%',null]];
    g.onclick=()=>{CM=g.dataset.m;renderCandles();};
    g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();CM=g.dataset.m;renderCandles();}});
    g.addEventListener('pointermove',ev=>TIP.show(ev.clientX,ev.clientY,rows()));
    g.addEventListener('pointerleave',()=>TIP.hide());
  });
}

/* 연도별 성과 + 헤드라인 지표.
   ★ Calmar 는 월간·일간을 같이 낸다 — 월간 MDD 는 월말 종가만 보므로 월중 낙폭을 놓친다. */
function renderStats(){
  const S=D.stats;
  if(!$('st'))return;
  if(!S){$('stsub').textContent='데이터 없음';$('st').innerHTML='';return;}
  $('stsub').innerHTML=`${S.frm} ~ ${S.to} · ${S.n}개월 · AM03 1.5배 · 월 2회
    <span class="plabel">매매비용 0.1% 반영</span>
    <div style="margin-top:5px">달러 기준입니다 — 원화 평가액은 환율이 따로 움직입니다.</div>`;

  const pc=(v,d=2)=>sg(v*100,d)+'%', ab=(v,d=2)=>(v*100).toFixed(d)+'%';
  const kpi=[
    ['CAGR',`<span class="${S.cagr>=0?'up':'dn'}">${pc(S.cagr,2)}</span>`,`누적 ${Math.round(S.total*100).toLocaleString('ko-KR')}%`],
    ['최대낙폭 (일간)',ab(S.dmdd,2),`월말 기준 ${ab(S.mdd,2)}`],
    ['Calmar (일간)',S.cald.toFixed(3),`월말 기준 ${S.cal.toFixed(3)}`],
    ['Sharpe',S.sharpe.toFixed(3),`변동성 ${ab(S.vol,1)}`],
    ['오른 달',`${S.win}/${S.n}`,`${(S.win/S.n*100).toFixed(0)}%`],
    ['고점 아래 최장',`${S.under}개월`,`최대 되돌림 ${ab(S.deep.dd,1)} · ${S.deep.m}`],
    ['최고의 달',`<span class="up">${pc(S.best.r,1)}</span>`,S.best.m],
    ['최악의 달',`<span class="dn">${pc(S.worst.r,1)}</span>`,S.worst.m]];

  const R=S.rng;
  // 12개월 수익이 음수였던 비율 — AM03 월봉(1998~)에서 직접 센다 (예전 문구의 '20년간 6%'는 AMP-D 값)
  const MC=D.candles||[];
  let neg12='';
  if(MC.length>12){
    const eq=[1]; MC.forEach(c=>eq.push(eq[eq.length-1]*(1+c.r)));
    let neg=0,tot=0; for(let i=12;i<eq.length;i++){tot++; if(eq[i]<eq[i-12])neg++;}
    neg12=`${MC[0].m.slice(0,4)}년 이후 12개월 수익이 음수였던 때는 전체의 ${Math.round(neg/tot*100)}%입니다.`;
  }
  let rng='';
  if(R){
    const cls={정상:'good',주의:'warn',점검:'bad'}[R.lvl]||'';
    const msg={정상:'아무것도 하지 마세요.',
               주의:'정상 범위의 꼬리입니다. 여전히 아무것도 하지 마세요.',
               점검:'전략보다 데이터·구현 오류를 먼저 의심하세요.'}[R.lvl];
    // 분위 대신 등수(좋은 쪽부터) — 지난 월 · 지난 12개월 구간과 견준 자리 (2026-10-17 사용자). 분포는 AM03 월봉(1998~)
    const pm=MC.slice(0,-1).map(c=>c.r), eqm=[1]; MC.forEach(c=>eqm.push(eqm[eqm.length-1]*(1+c.r)));
    const py=[]; for(let i=12;i<eqm.length-1;i++) py.push(eqm[i]/eqm[i-12]-1);
    const rk=(arr,v)=>v==null||!arr.length?'—':`${arr.length+1}개 중 ${arr.filter(x=>x>v).length+1}번째로 좋음`;
    const lo=arr=>arr.length?(Math.min(...arr)*100).toFixed(1)+'%':'—';
    const band=R.dd.map(([t,f])=>`-${(t*100).toFixed(0)}% ${(f*100).toFixed(0)}%`).join(' · ');
    rng=`<div class="rngc">
      <div class="hd"><b>지금 상태</b><span class="stat ${cls}">${R.lvl}</span><span class="msg">${msg}</span></div>
      <div class="dcard">
        <div><div class="l">현재 낙폭</div><div class="n">${(R.cur_dd*100).toFixed(1)}%</div>
             <div class="d">역대 최악 ${(R.worst_dd*100).toFixed(1)}%</div></div>
        <div><div class="l">최근 월</div><div class="n">${sg(R.cur_m*100,1)}%</div>
             <div class="d">${rk(pm,R.cur_m)} · 최악 ${lo(pm)}</div></div>
        <div><div class="l">최근 12개월</div><div class="n">${R.cur_y==null?'—':sg(R.cur_y*100,1)+'%'}</div>
             <div class="d">${rk(py,R.cur_y)} · 최악 ${lo(py)}</div></div>
      </div>
      <div class="foot2">낙폭 아래에서 보낸 시간: ${band}<br>
        <b>판정 기준</b> — 정상: 일간 낙폭 −15% 이내 &amp; 12개월 수익 양수 ·
        주의: −15~−25% 또는 12개월 음수 · 점검: 역대 최악 초과 또는 12개월 −10% 초과<br>
        <b>단일 월로 판단하지 마세요.</b> ${neg12}</div></div>`;
  }

  const mx=Math.max(...S.years.map(y=>Math.abs(y.r)))||0.01;
  const rows=S.years.map(y=>{
    const w=Math.abs(y.r)/mx*50, up=y.r>=0, ex=y.r-y.q;
    return `<tr>
      <td class="yy">${y.y}${y.full?'':`<span class="part">&#8202;${y.n}개월</span>`}</td>
      <td class="${up?'up':'dn'}">${pc(y.r,1)}</td>
      <td class="${y.q>=0?'up':'dn'}">${pc(y.q,1)}</td>
      <td class="${ex>=0?'up':'dn'}">${sg(ex*100,1)}%p</td>
      <td>${ab(y.mdd,1)}</td><td>${ab(y.dmdd,1)}</td><td>${y.win}/${y.n}</td>
      <td class="sp"><div class="spark"><div class="z" style="left:50%"></div>
        <i class="${up?'su':'sd'}" style="${up?'left:50%':'right:50%'};width:${w}%"></i></div></td></tr>`;}).join('');

  const wy=S.years.filter(y=>y.r>0).length;
  $('st').innerHTML= rng +
    `<div class="kpi">${kpi.map(([l,n,d])=>
      `<div><div class="l">${l}</div><div class="n">${n}</div><div class="d">${d}</div></div>`).join('')}</div>
    <div class="ywrap"><table class="ytbl">
      <thead><tr><th>연도</th><th>전략</th><th>QQQ</th><th>초과</th>
        <th>월MDD</th><th>일MDD</th><th>오른 달</th><th class="sp"></th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td class="yy">${S.years.length}개 해</td>
        <td class="up">이긴 해 ${wy}</td>
        <td colspan="2">QQQ 대비 ${S.years.filter(y=>y.r>y.q).length}승 ${S.years.filter(y=>y.r<=y.q).length}패</td>
        <td colspan="4">손실 난 해 ${S.years.length-wy}개</td></tr></tfoot>
    </table></div>`;
}

/* 그 달에 무엇을 얼마나 들고 있었나 — 직전 월말 결정의 목표 비중 */
function holdStrip(S){
  if(!S.w||!S.w.length)return '';
  const ONE=1e8, tot=S.w.reduce((a,x)=>a+x.w,0)||1;
  const bar=S.w.map(x=>`<i class="k-${x.k}" style="flex:${(x.w/tot).toFixed(4)} 1 0" title="${x.t} ${(x.w*100).toFixed(1)}%"></i>`).join('');
  const list=S.w.map(x=>`<span><i class="k-${x.k}"></i>${x.t}
    <b>${(x.w*100).toFixed(1)}%</b><em>${KIND[x.k]||''} · ${won(ONE*x.w)}원</em></span>`).join('');
  return `<div class="mhold">
    <div class="t"><b>이 달의 보유 구성</b> — 1억이면 이렇게 나뉩니다</div>
    <div class="hbar">${bar}</div><div class="hlist">${list}</div></div>`;
}

/* 고른 달 한 개 — 월초 1억이 그 달 안에서 어떻게 움직였는지 */
function monthDetail(S){
  if(!S)return '';
  const ONE=1e8, wv=r=>won(ONE*r)+'원', up=S.r>=0;
  const back=S.rh-S.rc;
  const cards=`<div class="dcard">
    <div><div class="l">마감</div><div class="n ${up?'up':'dn'}">${wv(S.rc)}</div>
      <div class="d">${sg(S.r*100,2)}%${back>0.0005?` · 고점에서 ${eokman(ONE*back)} 반납`:' · 고점에서 마감'}</div></div>
    <div><div class="l">월중 최고</div><div class="n">${wv(S.rh)}</div>
      <div class="d">${sg((S.rh-1)*100,2)}% · ${S.hid.slice(5)}</div></div>
    <div><div class="l">월중 최저</div><div class="n">${wv(S.rl)}</div>
      <div class="d">${sg((S.rl-1)*100,2)}% · ${S.lod.slice(5)}</div></div>
    <div><div class="l">되돌림</div><div class="n ${S.dd<-0.0005?'dn':''}">${(S.dd*100).toFixed(2)}%</div>
      <div class="d">월중 고점 대비 최대 낙폭</div></div>
  </div>`;

  const W=800,H=160,L=62,RG=10,TP=12,BT=22, n=S.v.length;
  const lo0=Math.min(...S.v,1), hi0=Math.max(...S.v,1);
  const pd=(hi0-lo0)*0.14||0.01, lo=lo0-pd, hi=hi0+pd;
  const X=i=>L+(W-L-RG)*(n>1?i/(n-1):0.5);
  const Y=v=>TP+(H-TP-BT)*(1-(v-lo)/(hi-lo));
  const y0=H-BT;
  let gl='';
  for(let k=0;k<=2;k++){
    const v=lo+(hi-lo)*k/2, y=Y(v).toFixed(1);
    gl+=`<line class="gl" x1="${L}" y1="${y}" x2="${W-RG}" y2="${y}"/>
      <text class="ay" x="${L-7}" y="${(+y+3.5).toFixed(1)}">${eokman(ONE*v)}</text>`;
  }
  gl+=`<line class="base" x1="${L}" y1="${Y(1).toFixed(1)}" x2="${W-RG}" y2="${Y(1).toFixed(1)}"/>
    <text class="dtag" x="${W-RG-2}" y="${(Y(1)-5).toFixed(1)}" text-anchor="end" style="fill:var(--ink3)">원금 1억</text>`;
  const ln=S.v.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const ar=`${ln} L${X(n-1).toFixed(1)} ${y0} L${X(0).toFixed(1)} ${y0} Z`;
  let ax='', st=Math.max(1,Math.round(n/6)), pick=[];
  for(let i=0;i<n;i+=st) pick.push(i);
  if(pick[pick.length-1]!==n-1){ if(n-1-pick[pick.length-1]<st*0.6) pick.pop(); pick.push(n-1); }
  pick.forEach(i=>{ax+=`<text class="ax" x="${X(i).toFixed(1)}" y="${H-6}"
    text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${+S.d[i].slice(8)}일</text>`;});
  const dot=(i,col,txt,above)=>{
    const x=X(i), y=Y(S.v[i]), left=x>W*0.62;
    return `<circle class="pt" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${col}"/>
      <text class="dtag" x="${(x+(left?-8:8)).toFixed(1)}" y="${(y+(above?-8:15)).toFixed(1)}" text-anchor="${left?'end':'start'}">${txt}</text>`;
  };
  const ih=S.v.indexOf(Math.max(...S.v)), il=S.v.indexOf(Math.min(...S.v));
  return `<div class="mdet">
    <div class="hd">${+CM.slice(0,4)}년 ${+CM.slice(5)}월<em>· 월초 1억이 이렇게 움직였습니다 · ${S.n}거래일</em></div>
    ${cards}${holdStrip(S)}
    <svg class="dchart ${up?'u':'d'}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${CM} 일별 평가액">${gl}
      <path class="ar" d="${ar}"/><path class="ln" d="${ln}"/>${ax}
      ${dot(ih,'var(--upf)','최고 '+eokman(ONE*S.v[ih]),true)}
      ${dot(il,'var(--dnf)','최저 '+eokman(ONE*S.v[il]),false)}</svg>
    <div class="pr">QQQ 같은 달 ${sg(S.q*100,2)}% · 초과 <b class="${S.r-S.q>=0?'up':'dn'}">${sg((S.r-S.q)*100,2)}%p</b></div>
  </div>`;
}

function holdRow(key,fx){
  const B=D[base], h=HOLD[key]||{q:0,a:0}, p=priceOfKey(key), kr=isKR(key), b=baseOf(key);
  const v=valueOf(key,h.q,fx);
  const cost=kr?h.q*(h.a||0):h.q*(h.a||0)*fx;
  const plp=cost>0?(v/cost-1)*100:0;
  const hint=kr?(p>0?won(p):''):(p>0?p.toFixed(2):'');     // 평단 칸 힌트 = 현재가
  let head;
  if(kr){
    const K=(D.kr||{})[b]||{}, code=symOf(key).slice(3);
    const nm=(K.alt&&K.alt[code])||K.n||'국내 ETF';
    head=`<div class="tick kr"><span class="code">${code}</span>
      <span class="map${isAlt(key)?' alt':''}">${isAlt(key)?'교체':b}</span>
      <span class="nm" title="${nm}">${nm}</span></div>`;
  }else{
    head=`<div class="tick"><span class="code">${symOf(key)}</span>
      <span class="nm">${GSUB[symOf(key)]||KIND[(B.w.find(x=>x.t===b)||{}).k]||'목표 외'}</span></div>`;
  }
  return `<div class="hrow ${kr?'krrow':''}">${head}
    <input class="q" data-t="${key}" data-f="q" value="${h.q?comma(h.q):''}" placeholder="0" inputmode="decimal">
    <input class="q" data-t="${key}" data-f="a" value="${h.a?comma(h.a):''}" placeholder="${hint}" inputmode="decimal">
    <div class="val"><b>${v>0?won(v):'–'}</b>${cost>0?
      `<span class="pl ${v>=cost?'up':'dn'}">${sg(plp,1)}%</span>`:''}</div></div>`;
}

/* 앵커·부스터가 왜 그 종목인지 — 시총 순위 / 모멘텀 순위를 그대로 보여준다 */
/* AM03 화면 맨 위 — 왜 이 비율인가. 엔진이 본 입력(10개월선 · 플러스 개수)과 엔진이 낸 비중을 보여준다 */
function am03Why(){
  const W=(D.am03||{}).why; if(!W||!W.A||!W.B) return '';
  const pct=v=>(v*100).toFixed(1)+'%', sg=v=>(v>=0?'+':'')+(v*100).toFixed(1)+'%';
  const bat=w=>{const c=w.slice(-1), k=c.charCodeAt(0); if(k>=0xAC00&&k<=0xD7A3) return (k-0xAC00)%28>0; return '013678'.includes(c);};
  const sn=r=>r.n.replace(/^미국\s*/,'').replace(/100$/,'');            // 문장용 짧은 이름 (미국 반도체 → 반도체)
  const names=a=>a.map(sn).join('·'), eun=a=>bat(sn(a[a.length-1]))?'은':'는';
  const nx=(D.am03||{}).next||{};
  const dots=pc=>`<span class="wdots" aria-label="신호 강도 ${pc}/5">${[1,2,3,4,5].map(i=>`<i${i<=pc?' class="f"':''}></i>`).join('')}</span><span class="wpc">${pc}/5</span>`;
  const bar=(w,k)=>`<span class="wbar"><i style="width:${Math.min(w*100,100).toFixed(1)}%;background:var(--k-${k})"></i></span>`;
  const trend=(on,gap)=>`<span class="wy ${on?'on':'off'}">${on?'위':'아래'}</span><span class="wgap">${sg(gap)}</span>`;
  const row=(n,t,tr,sig,w,k)=>`<div class="wrow"><div class="wn"><b>${n}</b><small>${t}</small></div>`+
    `<div class="wtr">${tr}</div><div class="wsg">${sig}</div><div class="ww"><b>${pct(w)}</b>${bar(w,k)}</div></div>`;

  /* 묶음 하나 — 엔진 순서 그대로: ① 10개월선 위인 자리만(각 25%) ② 아래 몫은 대피(TLT 추세 위면 최대 전부 × 신호 강도) ③ 담은 몫을 신호 강도대로 */
  function box(tag,lbl,X){
    const held=X.rows.filter(r=>r.on), out=X.rows.filter(r=>!r.on), t=X.tlt;
    const ev=out.length*0.25, tp=Math.max(t.pc,1), st=[];
    if(!out.length) st.push(['추세','네 자리 모두 10개월선 위 → 대피 없음']);
    else if(!held.length) st.push(['추세','네 자리 모두 10개월선 아래 → 전부 대피']);
    else st.push(['추세',`${names(held)}${eun(held)} 10개월선 위, ${names(out)}${eun(out)} 아래 → ${names(out)} 몫 ${pct(ev)} 대피`]);
    if(out.length) st.push(['대피', t.on
      ? `TLT 추세 위 · 신호 ${tp}/5 → ${pct(ev)} × ${tp}/5 = ${pct(t.w)} TLT, 나머지 ${pct(X.cash)} 현금`
      : `TLT도 10개월선 아래(${sg(t.gap)}) → ${pct(ev)} 전부 현금`]);
    if(held.length) st.push(['나누기', held.length===1 ? `${sn(held[0])} 한 자리에 ${pct(1-ev)}`
      : `담은 ${pct(1-ev)}를 신호 강도(${held.map(r=>Math.max(r.pc,1)).join(' : ')})대로 → ${held.map(r=>pct(r.w)).join(' · ')}`]);
    const rows=X.rows.map(r=>row(r.n,r.t,trend(r.on,r.gap),r.on?dots(Math.max(r.pc,1)):'<span class="wna">—</span>',r.w,'core')).join('')
      + row('장기국채','TLT',trend(t.on,t.gap),t.on?dots(tp):'<span class="wna">—</span>',t.w,'def')
      + row('현금','SGOV','','',X.cash,'cash');
    const nd=nx[tag];
    return `<div class="wb"><div class="wbh"><span class="wtag">${tag}</span><div><b>${lbl}</b>`+
      `<small>${X.date} 종가로 판단${nd&&nd.length>5?` · 다음 ${nd.slice(5)}`:''}</small></div></div>`+
      `<ol class="wsteps">${st.map(([k,v])=>`<li><em>${k}</em><span>${v}</span></li>`).join('')}</ol>`+
      `<div class="wrows">${rows}</div></div>`;
  }

  /* 한 줄 요약 — 두 묶음이 같이 뺀 자리 · 갈린 자리 · 대피 몫의 행방 */
  const pair=W.A.rows.map((r,i)=>[r,W.B.rows[i]]);
  const off=pair.filter(([a,b])=>!a.on&&!b.on).map(p=>p[0]), split=pair.filter(([a,b])=>a.on!==b.on).map(p=>p[0]);
  const tlt=(W.A.tlt.w+W.B.tlt.w)/2, cash=(W.A.cash+W.B.cash)/2, lead=[];
  if(off.length) lead.push(`<b>${names(off)}</b>${eun(off)} 두 묶음 모두 10개월선 아래라 비었습니다.`);
  if(split.length) lead.push(`<b>${names(split)}</b>${eun(split)} 두 묶음 판단이 갈려 한 묶음에서만 담았습니다.`);
  if(tlt+cash>0.001) lead.push(tlt>0.001 ? `대피 몫 ${pct(tlt+cash)} 중 <b>${pct(tlt)}</b>는 장기국채, 나머지는 현금입니다.`
                                         : `대피 몫 <b>${pct(cash)}</b>는 장기국채도 추세 아래라 전부 현금입니다.`);
  else lead.push('네 자리 모두 담았습니다 — 대피 없음.');

  /* 실제 목표 — 이전 → 새 (2026-10-17 사용자). 이전 = 가장 최근에 결정한 묶음만 그 직전 결정으로 둔 평균(서버 am03.prev) */
  const PV=(D.am03||{}).prev, chg=PV?['A','B'].filter(t=>PV[t].date!==W[t].date):[];
  const seats=X=>X.rows.map(r=>r.w).concat([X.tlt.w,X.cash]);
  const was=PV?seats(PV.A).map((v,i)=>(v+seats(PV.B)[i])/2):null;
  let nchg=0;
  const tot=pair.map(([a,b])=>({n:a.n,t:a.t,a:a.w,b:b.w,k:'core'}))
    .concat([{n:'장기국채',t:'TLT',a:W.A.tlt.w,b:W.B.tlt.w,k:'def'},{n:'현금',t:'SGOV',a:W.A.cash,b:W.B.cash,k:'cash'}])
    .map((x,i)=>{
      const nw=(x.a+x.b)/2, ow=was?was[i]:null, d=ow==null?0:nw-ow, moved=Math.abs(d)>=0.0005;
      if(moved)nchg++;
      return `<div class="wrow${moved?' chg':''}" title="A ${pct(x.a)} · B ${pct(x.b)}"><div class="wn"><b>${x.n}</b><small>${x.t}</small></div>`+
        (ow==null?`<div class="wab2">A ${pct(x.a)} · B ${pct(x.b)}</div>`:`<div class="wab2">${pct(ow)}<span aria-hidden="true"> →</span></div>`)+
        `<div class="ww"><b>${pct(nw)}</b>${bar(nw,x.k)}</div>`+
        (ow==null?'':moved?`<div class="wd ${d>0?'up':'dn'}">${d>0?'+':'−'}${(Math.abs(d)*100).toFixed(1)}%p</div>`:'<div class="wd same">그대로</div>')+`</div>`;
    }).join('');
  const dd=X=>`A ${X.A.date.slice(5)} · B ${X.B.date.slice(5)}`;
  const thead=PV?`<div class="wthead"><span>이전 <b>${dd(PV)}</b> 결정 → 새 <b>${dd(W)}</b> 결정</span>`+
    `<span>${chg.length?`이번에 바뀐 묶음 <b>${chg.join(' · ')}</b> · `:''}${nchg?`비중이 바뀐 자리 ${nchg}개`:'목표 비중 그대로'}</span></div>`+
    `<div class="wthc"><span>자리</span><span>이전</span><span>새 목표</span><span>변화</span></div>`:'';

  return `<section class="card sec whybox enter"><h2>왜 이 비율인가</h2>
    <div class="sub">자금을 반씩 <b>A</b>(월말) · <b>B</b>(월말 10거래일 전) 두 묶음으로 나눠, 묶음마다 자기 날짜 종가로 따로 판단합니다. 실제 목표는 두 묶음의 평균입니다.</div>
    ${base==='day'?`<div class="wnote">지금은 「참고 · 오늘 재계산」 탭이지만, 이 설명은 실제 결정(A ${W.A.date} · B ${W.B.date}) 기준입니다.</div>`:''}
    <p class="wlead">${lead.join(' ')}</p>
    <div class="wab">${box('A','월말 묶음',W.A)}${box('B','월말 10거래일 전 묶음',W.B)}</div>
    <div class="wtot"><h3>실제 목표 = (A + B) ÷ 2${PV?' · 이전 → 새':''}</h3>${thead}${tot}</div>
    <div class="wfoot">● 신호 강도 = 1 · 3 · 6 · 9 · 12개월 수익 중 플러스 개수 — 10개월선 아래인 자리는 보지 않습니다(—).

function allocInt(w,total){   // 비중 → 정수 원. 마지막 항목이 잔돈을 흡수해 합=총자산을 보장
  const s=w.reduce((a,b)=>a+b.w,0)||1, out={}; let acc=0;
  w.forEach((x,i)=>{ if(i===w.length-1){out[x.t]=Math.max(total-acc,0);}
    else{const v=Math.round(x.w/s*total);out[x.t]=v;acc+=v;} });
  return out;
}
/* 추가 납입금 배정 — 체크한 계좌(한도 남음)에 넣되 목표 구성이 깨지지 않는 만큼만.
   ① 연금+ISA 가 1·2배수 목표액을 넘지 않게 → 일반계좌에 일반 전용 자산(원자재 등) 몫이 남는다
   ② 연금은 1배수 목표액까지, ISA는 1·2배수 목표액까지 — 넘치면 그 계좌 안에서 현금으로 주차된다
   ③ 둘 다 체크면 연금 먼저(세액공제) → 남으면 ISA → 그래도 남으면 일반 */
function assignAdd(ALL,amt){
  const A={P:0,I:0,G:0,why:''};
  if(amt<=0)return A;
  const sumOf=ok=>Object.keys(ALL).filter(t=>ok.includes(t)).reduce((s,t)=>s+ALL[t],0);
  const penSum=sumOf(D.pen_ok||[]), isaSum=sumOf(D.isa_ok||[]);
  const p0=Math.max(capBase('P'),0), i0=Math.max(capBase('I'),0);
  let lim=Math.max(isaSum-p0-i0,0), left=amt;
  if($('add_P')&&$('add_P').checked){
    A.P=Math.min(left,lim,Math.max(penSum-p0,0)); left-=A.P; lim-=A.P;
    if(left>0)A.why=lim<=0?'stock':'full';
  }
  if($('add_I')&&$('add_I').checked){
    A.I=Math.min(left,lim,Math.max(isaSum-Math.min(p0+A.P,penSum)-i0,0)); left-=A.I;
    A.why=left>0?(lim-A.I<=0?'stock':'full'):'';
  }
  A.G=left;
  return A;
}

/* 3계좌 배분 — 제약이 심한 계좌부터 채운다(2026-09-28 규칙 · 10-04 '팔지 않고 맞추기'는 세후 연 −0.3%p 라 되돌림, CANON §10-96).
   ① 연금저축: 1배수 ETF만   ② ISA: 레버리지 먼저(연금 불가라서) → 남은 1배수
   ③ 일반: 일반 전용 자산(원자재 등) + 나머지 전부
   매번 이 순서로 새로 배치한다 — 과세 이익이 큰 자산을 세금 없는 계좌로 옮기는 매도는 지금 조금 내고 나중에 크게 아끼는 매도다.
   목표보다 계좌가 크면 남는 자리를 그 계좌 안에서 현금성(SGOV 대응 국내 ETF)으로 채운다.
   그 돈은 물리적으로 그 계좌에 들어 있어 일반계좌로 넘길 수 없기 때문 —
   넘기면 일반계좌 배분액이 실제 계좌 크기보다 커진다(총합만 맞고 계좌별로는 틀림). */
const PARK='SGOV';
function splitAccounts(ALL,total){
  const rest={...ALL}, P={}, I={}, G={};
  let rp=Math.min(Math.max(capOf('P'),0),total);
  let ri=Math.min(Math.max(capOf('I'),0),Math.max(total-rp,0));
  for(const t of (D.pen_ok||[])){
    if(!(t in rest)||rp<=0)continue;
    const take=Math.min(rest[t],rp); if(take<=0)continue;
    P[t]=take; rest[t]-=take; rp-=take;
  }
  const isaOnly=(D.isa_ok||[]).filter(t=>!(D.pen_ok||[]).includes(t));   // 레버리지
  for(const t of isaOnly.concat(D.pen_ok||[])){
    if(!(t in rest)||ri<=0)continue;
    const take=Math.min(rest[t],ri); if(take<=0)continue;
    I[t]=(I[t]||0)+take; rest[t]-=take; ri-=take;
  }
  if(rp>0)P[PARK]=(P[PARK]||0)+rp;
  if(ri>0)I[PARK]=(I[PARK]||0)+ri;
  for(const t in rest){ if(rest[t]>0)G[t]=rest[t]; }
  // 주차한 만큼 일반에서 덜어낸다.
  //  ① 현금성(SGOV)부터 상계 — 다른 계좌에 현금을 세워뒀으니 여기 현금은 덜 필요
  //  ② 그래도 남으면 나머지를 비중대로 — 한 종목만 깎으면 위험자산 간 상대비중이 무너진다
  let park=rp+ri;
  if(park>0){
    const c0=Math.min(G[PARK]||0,park);
    if(c0>0){ G[PARK]-=c0; park-=c0; if(G[PARK]<=0)delete G[PARK]; }
    const rem=Object.keys(G), sum=rem.reduce((s,t)=>s+G[t],0), need=park;
    if(park>0&&sum>0){
      for(const t of rem){
        // 비율은 반드시 '처음' 깎아야 할 금액(need) 기준 — 루프 안에서 줄어드는 park를
        // 쓰면 첫 종목만 제대로 깎이고 잔여가 큰 종목에 몰린다
        const c=Math.min(G[t],Math.round(G[t]/sum*need));
        G[t]-=c; park-=c;
      }
      while(park>0){                       // 반올림 잔여는 가장 큰 항목에서
        const t=Object.keys(G).sort((a,b)=>G[b]-G[a])[0];
        if(!t||G[t]<=0)break;
        const c=Math.min(G[t],park); G[t]-=c; park-=c;
      }
      for(const t of Object.keys(G)) if(G[t]<=0) delete G[t];
    }
  }
  return {P,I,G,park:rp+ri};
}
function defaultKey(acc,b){   // 그 계좌에서 기본으로 매매할 종목 — 연금·ISA는 국내상장

function usDST(d){ const y=d.getFullYear(), sun=(m,k)=>{const x=new Date(y,m,1); x.setDate(1+(7-x.getDay())%7+7*(k-1)); return x;};
  return d>=sun(2,2)&&d<sun(10,1); }
const fmtMD=d=>`${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}(${'일월화수목금토'[d.getDay()]})`;
function tradePlan(sig){
  const d=new Date(sig+'T12:00:00'); do{ d.setDate(d.getDate()+1); }while(d.getDay()===0||d.getDay()===6);
  return {md:fmtMD(d), us:usDST(d)?'22:30':'23:30', iso:d.toLocaleDateString('sv-SE'), d};

  const thr=Math.max(total*0.005,10000);
  const dm=doneMap();
  let sumB=0,sumS=0,html='';
  const tp=tradePlan(B.sig), cnt={}, krG={};
  ['P','I','G'].forEach(a=>{
    const tgt=SP[a]||{}, cu=cur[a]||{};
    const ts=[...new Set(Object.keys(tgt).concat(Object.keys(cu)))];
    // 안 쓰는 계좌도 자리는 남긴다 — 세 열의 블록 구성이 같아야 높이를 맞출 수 있다
    if((a!=='G'&&capOf(a)<=0)||!ts.length){
      html+=`<div class="abox off" data-a="${a}"><div class="ahead">
        <div class="n">${ACCN[a]}<small>${a==='G'?'미국 직투':'국내상장 ETF'}</small></div>
        <div class="v"><small>–</small></div></div><div class="asub"></div>
        <div class="anote">${a==='G'?'배분 없음':'계좌 총액을 넣으면 계산됩니다'}</div></div>`;
      return;
    }
    const items=[];
    ts.forEach(b=>{
      const held=(inst[a+'|'+b]||{}).k, prim=defaultKey(a,b);
      if(held&&prim&&held!==prim&&isAlt(held)){
        // 옛 코드 보유 → 전량 매도하고 새 코드로 목표 전액 매수 (상계하지 않는다)
        items.push({b, key:held, d:-(cu[b]||0)});
        items.push({b, key:prim, d:(tgt[b]||0)});
      }else{
        const d=(tgt[b]||0)-(cu[b]||0), hs=(insts[a+'|'+b]||[]).slice().sort((x,y)=>y.v-x.v);
        if(d<0&&hs.length>1){
          // 같은 노출을 두 종목으로 들고 있으면(예: SOXX + SMH) 큰 것부터 나눠 판다 — 가진 것보다 많이 팔라고 하지 않게
          let left=-d;
          hs.forEach(h=>{ if(left<=0)return; const s=Math.min(h.v,left); items.push({b, key:h.k, d:-s}); left-=s; });
        }else{
          items.push({b, key:held||prim, d});
        }
      }
    });
    const list=items.map(o=>{
      const p=o.key?priceOfKey(o.key):0, kr=o.key?isKR(o.key):false;
      return {...o, kr, sh:p>0?(kr?Math.abs(o.d)/p:Math.abs(o.d)/fx/p):0};
    }).sort((x,y)=>(x.d<0?0:1)-(y.d<0?0:1)||Math.abs(y.d)-Math.abs(x.d));   // 팔기 먼저(판 돈으로 산다) · 그 안에서 큰 것부터
    let ab=0,as=0; const keep=[];
    const live=list.filter(o=>Math.abs(o.d)>thr), both=live.some(o=>o.d<0)&&live.some(o=>o.d>0);
    let lastKind='';
    const rows=list.map(o=>{
      const L=instLabel(o.b,o.key);
      if(Math.abs(o.d)<=thr){ if(cu[o.b]>0)keep.push(L.t); return ''; }   // 유지는 한 줄로 모은다
      const kind=o.d>0?'buy':'sell';
      if(kind==='buy')ab+=o.d; else as+=-o.d;
      cnt[a]=(cnt[a]||0)+1; if(a==='G'&&o.kr)krG.G=1;
      const step=both&&kind!==lastKind?`<div class="ostep">${kind==='sell'?'① 먼저 팔기':'② 그다음 사기'}</div>`:''; lastKind=kind;
      const dk=`${B.sig}|${base}|${a}|${L.t}|${kind}|${Math.round(Math.abs(o.d)/1000)}`, done=!!dm[dk];
      return step+`<button class="ord ${kind}${done?' done':''}" data-k="${dk}" aria-pressed="${done}">
        <span class="tag ${kind}">${kind==='buy'?'매수':'매도'}</span>
        <span class="who"><b>${L.t}</b>${L.sub?`<span>${L.sub}</span>`:''}</span>
        <span class="qty"><b>${o.sh>0?(o.kr?won(o.sh):o.sh.toFixed(2))+'주':'–'}</b>
          <span>${won(Math.abs(o.d))}원</span></span>
        <span class="okm" aria-hidden="true"><svg viewBox="0 0 14 14"><path d="M3 7.4l2.7 2.6L11 4.4"/></svg></span></button>`;
    }).join('');
    sumB+=ab; sumS+=as;
    const when=a==='G'?`미국 장 · ${tp.md} 밤 ${tp.us}~${krG.G?' (국내상장은 낮)':''}`:`한국 장 · ${tp.md} 09:00~15:30`;
    html+=`<div class="abox" data-a="${a}"><div class="ahead">
      <div class="n">${ACCN[a]}<small>${when}</small></div>
      <div class="v">${ab>0?`<span class="b">+${won(ab)}</span>`:''}${
        as>0?`<span class="s">−${won(as)}</span>`:''}${
        (!ab&&!as)?'<small>변경 없음</small>':''}</div></div>
      <div class="asub">${ab||as?`매매 ${won(ab+as)}원`:''}</div>`
      + rows + (keep.length?`<div class="okeep">${keep.join(' · ')} 유지</div>`:'')
      + `</div>`;      // ★ .abox 를 닫는다 — 안 닫으면 다음 계좌가 이 계좌 안에 들어간다
  });
  $('orders').innerHTML=html
    ? `<div class="colhead"><span>구분 · 종목</span><span>주수 · 금액</span></div>`+html
    : '<div class="empty">보유를 입력하면 주문이 계산됩니다</div>';
  animNum($('obuy'),sumB,v=>won(v)+'원'); animNum($('osell'),sumS,v=>won(v)+'원');
  $('ordsub').textContent=`목표 대비 ±0.5% 초과분만 · 환율 ${won(fx)}원`;
  const krA=['P','I'].filter(a=>cnt[a]), st=[];
  if(krA.length) st.push(`<span class="os"><i>${st.length+1}</i>한국 장 <b>09:00~</b> ${krA.map(a=>ACCN[a]).join(' · ')}</span>`);
  if(cnt.G) st.push(`<span class="os"><i>${st.length+1}</i>미국 장 <b>밤 ${tp.us}~</b> 일반</span>`);
  $('otodo').innerHTML=`<b class="od">${base==='day'?'참고 · ':''}매매일 ${tp.md}</b>`+
    (st.length?st.join('<span class="oarr" aria-hidden="true">→</span>')+'<span class="onote">계좌마다 팔기 먼저, 사기 나중</span>'
              :'<span class="onote">이번엔 사고팔 것이 없습니다 — 전부 유지</span>');
  updateProg(false);
  renderFinal(total,fx,ALL,SP,inst,B);
}

/* 3 최종 계좌 — 계좌 나누기 전 목표(전체 합산) + 매매 후 각 계좌의 모습 + 검산.
   계좌마다 종류별 구성 막대(2px 틈)를 얹었다 — 숫자는 개편 전과 같다 */
function renderFinal(total,fx,ALL,SP,inst,B){
  if(!$('final'))return;
  if(total<=0){$('final').innerHTML='<div class="empty">보유를 입력하면 계산됩니다</div>';return;}
  const NOTE={P:'1배수 ETF만', I:'1·2배수 ETF', G:'제한 없음'};
  const at=Object.keys(ALL).sort((x,y)=>ALL[y]-ALL[x]);
  const kindOf=t=>((B.w.find(x=>x.t===t)||{}).k)||(t===PARK?'cash':'core');
  const mbar=(map,keys,sum)=>{
    const g={}; keys.forEach(t=>{const k=kindOf(t); g[k]=(g[k]||0)+map[t];});
    return sum>0?`<div class="mbar">${KORDER.filter(k=>g[k]>0).map(k=>
      `<i class="k-${k}" style="flex-grow:${(g[k]/sum).toFixed(4)}" title="${KIND[k]} ${(g[k]/sum*100).toFixed(1)}%"></i>`).join('')}</div>`:'';
  };
  let h=`<div class="colhead"><span>종목</span><span>주수 · 금액</span></div>`;

  ['P','I','G'].forEach(a=>{
    const map=SP[a]||{}, ks=Object.keys(map).sort((x,y)=>map[y]-map[x]);
    if(a!=='G'&&capOf(a)<=0){                  // 자리는 남긴다 (열 간 높이 정렬용)
      h+=`<div class="abox off" data-a="${a}"><div class="ahead">
        <div class="n">${ACCN[a]}<small>${NOTE[a]}</small></div>
        <div class="v"><small>–</small></div></div><div class="asub"></div>
        <div class="anote">계좌 총액을 넣으면 계산됩니다</div></div>`;
      return;
    }
    const sum=ks.reduce((s,t)=>s+map[t],0);
    h+=`<div class="abox" data-a="${a}"><div class="ahead">
      <div class="n">${ACCN[a]}<small>${NOTE[a]}</small></div>
      <div class="v">${won(sum)}원</div></div>
      <div class="asub">총자산의 ${(sum/total*100).toFixed(1)}%</div>${mbar(map,ks,sum)}`;
    h+= ks.length ? ks.map(t=>{
      let key=(inst[a+'|'+t]||{}).k||defaultKey(a,t);
      if(isAlt(key))key=defaultKey(a,t)||key;    // 교체 대상은 새 코드로 표시
      const p=key?priceOfKey(key):0, kr=key?isKR(key):false;
      const L=instLabel(t,key);
      const sh=p>0?(kr?map[t]/p:map[t]/fx/p):0;
      return `<div class="frow" style="--kc:var(--k-${kindOf(t)})"><div class="t">${L.t}${L.sub?`<small>${L.sub}</small>`:''}</div>
        <div class="q">${sh>0?(kr?won(sh):sh.toFixed(2))+'주':'–'}</div>
        <div class="m">${won(map[t])}원</div></div>`;
    }).join('') : '<div class="fnone">배분 없음</div>';
    h+='</div>';
  });

  // 전체 합산은 맨 뒤 — 1·2번은 계좌만 있으므로 앞 세 블록이 세 열에서 같은 줄에 오게
  h+=`<div class="abox"><div class="ahead">
      <div class="n">전체 합산<small>계좌 나누기 전 목표</small></div>
      <div class="v">${won(total)}원</div></div>
    <div class="asub">비중 기준</div>${mbar(ALL,at,total)}<div class="fall">`+
    (at.map(t=>{
      const it=B.w.find(x=>x.t===t)||{k:'core'};
      return `<div class="frow" style="--kc:var(--k-${it.k})"><div class="t">${t}<em>${KIND[it.k]||''}</em></div>
        <div class="q">${(ALL[t]/total*100).toFixed(1)}%</div>
        <div class="m">${won(ALL[t])}원</div></div>`;
    }).join('')||'<div class="fnone">배분 없음</div>')+`</div></div>`;

  const sP=Object.values(SP.P).reduce((a,b)=>a+b,0);
  const sI=Object.values(SP.I).reduce((a,b)=>a+b,0);
  const sG=Object.values(SP.G).reduce((a,b)=>a+b,0);
  // 개별주는 일반계좌 전용 — 연금·ISA가 너무 크면 담을 자리가 모자란다
  const stockNeed=at.filter(t=>!(D.isa_ok||[]).includes(t)).reduce((s,t)=>s+ALL[t],0);
  const genCap=Math.max(total-sP-sI,0);
  if(stockNeed>genCap+1)
    h+=`<div class="fwarn">⚠ 일반계좌가 부족합니다 — 일반계좌 전용 자산(원자재 · 금 2배)에 ${won(stockNeed)}원이 필요한데
      여유는 ${won(genCap)}원입니다. 연금·ISA 총액을 줄여 입력하세요.</div>`;
  const ok=Math.abs(sP+sI+sG-total)<=1;
  h+=`<div class="chk ${ok?'':'bad'}">${won(sP)} + ${won(sI)} + ${won(sG)} = ${
    won(sP+sI+sG)}원 ${ok?'· 총자산 일치':'· 불일치'}</div>`;
  $('final').innerHTML=h;
}

function renderPerf(){
  const P=D.perf;
  if(!P||!P.items||!P.items.length){$('perfsub').textContent='데이터 없음';return;}
  const cut=(P.cuts||[]).map(d=>d.slice(5)).join(' · ');
  $('perfsub').innerHTML=`전월 말 ${P.frm} 종가 → ${P.to} 종가${cut?` · ${cut} 리밸 반영`:''}`+(P.label?` <span class="plabel">${P.label}</span>`:'');
  let rank='';
  // 역대 분포 = AM03 자신의 월 수익(연도별 표와 같은 1998~ 월봉 · 진행 중인 달 제외).
  // (D.dist 는 AMP-D 의 2006~ 월 분포라 쓰지 않는다)
  const MC=(D.candles||[]).filter(c=>c.m!==P.to.slice(0,7));
  if(MC.length>=24){
    const rets=MC.map(c=>c.r).sort((a,b)=>a-b), n=rets.length, r=pctOf(rets,P.total)+1, low=r/n*100;
    const worst=MC.reduce((a,c)=>c.r<a.r?c:a), med=(rets[(n-1)>>1]+rets[n>>1])/2;
    let eq=1,pk=1,mdd=0; MC.forEach(c=>{eq*=1+c.r; pk=Math.max(pk,eq); mdd=Math.min(mdd,eq/pk-1);});
    const desc=low<=5?'역대급으로 나쁜 달':low<=25?'나쁜 편':low<=75?'평범한 달':low<=95?'좋은 편':'역대급으로 좋은 달';
    const g=MC.filter(c=>c.r>P.total).length+1;     // 등수는 좋은 쪽부터 — 1번째 = 역대 최고의 달 (2026-10-17 사용자 '전부 좋음 기준')
    rank=`<div class="pr">${n+1}개월 중 <b>${g}번째로 좋은 달</b> · ${desc}</div>
      <div class="rbar"><div class="fill" style="width:${Math.max(low,1)}%"></div>
        <div class="pin" style="left:calc(${Math.min(Math.max(low,0),100)}% - 2px)"></div></div>
      <div class="barlab"><span>최악 ${(rets[0]*100).toFixed(1)}% · ${worst.m}</span>
        <span>중앙값 ${sg(med*100,1)}%</span>
        <span>최대낙폭(월말) ${(mdd*100).toFixed(1)}%</span>
        <span>최고 ${sg(rets[n-1]*100,1)}%</span></div>`;
  }
  // 원화 환산 = 지금 보유 평가액(오늘 종가)을 이번 달 수익률로 되짚은 결정일 평가액 기준. 보유를 안 넣었으면 원화 줄은 숨긴다
  // (D.krw 는 AMP-D 시절 accounts.py 의 고정 투자금 7,200만이라 AM03 에선 쓰지 않는다)
  const KRW=NOWV>0?NOWV/(1+P.total):0;
  const wonS=v=>(v<0?'-':'+')+Math.abs(Math.round(v)).toLocaleString('ko-KR')+'원';
  $('perfhead').innerHTML=
    `<div class="perf"><div class="big2 ${P.total>=0?'up':'dn'}">${sg(P.total*100)}%</div>
      ${KRW?`<div class="big3 ${P.total>=0?'up':'dn'}">${wonS(KRW*P.total)}</div>`:''}
      <div class="bm">${P.qqq!=null?`QQQ ${sg(P.qqq*100)}% · 초과 <b class="${
        P.total-P.qqq>=0?'up':'dn'}">${sg((P.total-P.qqq)*100)}%p</b>`:''}</div></div>`+
    (KRW?`<div class="pr">지금 보유 기준 평가액 약 ${Math.round(KRW).toLocaleString('ko-KR')}원 → <b>${
      Math.round(NOWV).toLocaleString('ko-KR')}원</b></div>`:'')+rank;
  $('perfrows').innerHTML=P.items.map(i=>
    `<div class="pbar"><div><span class="tk">${i.t}</span><span class="bd">${(i.w*100).toFixed(1)}%</span></div>
      <div class="r ${i.r>=0?'up':'dn'}">${sg(i.r*100)}%</div>
      <div class="c ${i.c>=0?'up':'dn'}">${sg(i.c*100)}%p${
        KRW?`<span class="bd" style="margin-left:6px">${wonS(KRW*i.c)}</span>`:''}</div></div>`).join('');
}

function renderSnap(){
  if(!$('snapbox'))return;
  const S=snapRows();
  if(!S||!S.rows.length){$('snapbox').innerHTML='';return;}
  const pl=S.rows.reduce((s,r)=>s+r.pl,0);
  const hasCost=S.rows.some(r=>r.a>0);
  const money=(v,kr)=>kr?won(v)+'원':'$'+v.toFixed(2);
  $('snapbox').innerHTML=`<section class="card sec snap">
    <h3>저장된 보유 · ${S.at} <span class="plabel">현재 시세로 재계산</span></h3>
    <div class="snapwrap"><table><thead><tr><th>종목</th><th>수량</th><th>평단</th><th>현재가</th><th>평가액</th><th>손익</th></tr></thead>
    <tbody>${S.rows.map(r=>`<tr><td>${r.t}${r.nm?`<small>${r.nm}</small>`:''}</td>
      <td>${r.q.toLocaleString('ko-KR')}</td>
      <td>${r.a?money(r.a,r.kr):'–'}</td><td>${r.p>0?money(r.p,r.kr):'–'}</td>
      <td>${r.v>0?won(r.v)+'원':'–'}</td>
      <td class="${r.pl>=0?'up':'dn'}">${r.a&&r.p>0?sg(r.plp*100,1)+'%':'–'}</td></tr>`).join('')}</tbody></table></div>
    <div class="sfoot"><span>예수금 ${won(S.cash)}원 · 환율 ${won(S.fx)}</span>
      <span>총 ${won(S.total)}원${hasCost?` · 평가손익 <b class="${pl>=0?'up':'dn'}">${
        (pl>=0?'+':'')+won(pl)}원</b>`:''}</span></div></section>`;
}

/* 새로고침 — 다시 받는 동안 화면은 그대로 두고 흐리게만 한다(깜빡임·레이아웃 점프 없음) */
async function refresh(){
  if(!LIVE){ location.reload(); return; }
  const b=$('rf'), body=$('body');
  b.disabled=true; b.classList.add('busy'); b.setAttribute('aria-busy','true');
  if($('holds'))body.style.opacity='.55';
  try{
    const r=await fetch('/api/data?'+(MODE==='am03'?'am03=1&':'')+'t='+Date.now());
    const j=await r.json(); if(j.error)throw new Error(j.error);
    D=j; render(); toast('최신 시세 반영');
  }catch(e){ toast('조회 실패: '+String(e.message||e).slice(0,40)); }
  finally{ b.disabled=false; b.classList.remove('busy'); b.removeAttribute('aria-busy'); body.style.opacity=''; }
}

loadLS();
if($('brand')) $('brand').textContent = BRAND;
$('rf').addEventListener('click',refresh);
$('save').addEventListener('click',saveLS);
if(D){ render(); } else { refresh(); }
</script>
